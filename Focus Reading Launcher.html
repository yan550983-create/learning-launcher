<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=web/index.html" />
    <title>打开 Focus Reading Launcher</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fffaf2;
        --ink: #2e2a23;
        --muted: #766b5c;
        --line: #d9c9b4;
        --accent: #8b5e34;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 34rem),
          #f7f1e8;
      }

      main {
        width: min(560px, calc(100vw - 40px));
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--paper);
        box-shadow: 0 24px 80px rgba(71, 54, 31, 0.12);
        text-align: center;
      }

      .icon {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        border-radius: 24px;
        background: #efe1cf;
        font-size: 34px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.75;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        color: #fffaf2;
        background: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      small {
        display: block;
        margin-top: 18px;
        color: #8f8170;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="icon" aria-hidden="true">📖</div>
      <h1 id="title">Focus Reading Launcher</h1>
      <p>正在打开本地阅读应用。这个版本不需要上传，不需要终端，也不会把学习材料发送到网络。</p>
      <a href="web/index.html">进入阅读 Session</a>
      <small>如果没有自动打开，请点击上面的按钮。之后可以给这个文件创建桌面快捷方式；不要只把它单独复制走，因为它需要旁边的 web/ 文件夹。</small>
    </main>
  </body>
</html>
